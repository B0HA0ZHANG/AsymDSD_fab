# Packed FAB semantic/geometric masking model config
#
# With multi_mask=6, produces 6 mask paths:
#   Semantic block+sparse (attention-guided):
#     A: high-attention visible (head_a)
#     B: high-attention masked (head_b)
#   Semantic sparse-only (purely attention-guided):
#     C: high-attention visible (head_c)
#     D: high-attention masked (head_d)
#   Geometric (no attention):
#     E: random reverse-block
#     F: random half-space
#
# Inherits all other settings from ssrl_model.yaml.

mask_generator:
  class_path: asymdsd.components.RandomPatchMasking
  init_args:
    mask_ratio: 0.7
    multi_mask: 6

# --- Semantic block+sparse paths ---
semantic_visible_mask_ratio: 0.7
semantic_masked_mask_ratio: 0.5

# --- Semantic sparse-only paths ---
sparse_visible_mask_ratio: 0.7
sparse_masked_mask_ratio: 0.5

# --- Geometric paths ---
geometric_reverse_mask_ratio: 0.7
geometric_halfspace_mask_ratio: 0.5

# Compute patch loss on all six paths, averaged equally per path.
patch_loss_a_only: false

# Use FlashAttention varlen for zero-waste packing (requires PyTorch >= 2.4).
# Falls back to separate encoder calls when unavailable or when
# relative_3d_bias is enabled.
use_varlen_flash_attn: true

# --- 3D_bias_only port ---
# Match the older ssrl_model_encoder_bias_only.yaml setting: add a learned
# relative 3D attention bias in the encoder, with no extra auxiliary losses.
# num_heads is synced from encoder_config.num_heads by the Transformer.
encoder_config:
  relative_3d_bias:
    class_path: asymdsd.layers.Relative3DBiasConfig
    init_args:
      num_heads: 6
      hidden_dim: 64
      use_distance: true

# Current repo name for the old relative_3d_bias_scale knob.
attn_bias_scale: 1.0

# --- Block parameters (for semantic block+sparse paths) ---
# Each block center expands to ~10% of patches via KNN
block_ratio: 0.1

# Let FAB choose the block-center count per path from that path's selected
# quota, so different mask ratios can use different block counts.
num_block_centers:

# --- Temperature annealing ---
# High → near-random (early), low → attention-focused (late)
attn_mask_temperature:
  class_path: asymdsd.components.CosineAnnealingWarmupSchedule
  init_args:
    base_value: 2.0
    final_value: 0.5
    max_epochs: -1

attn_mask_top_k: false
attn_layer_index: -1
attn_num_layers: 3
